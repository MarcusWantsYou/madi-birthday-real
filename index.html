<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#20134a">
<title>For Madi</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#0b0820;overflow:hidden;font-family:'Press Start 2P',monospace;color:#fff}
[hidden]{display:none!important}
img,canvas{image-rendering:pixelated}
#game{--g:16%;--s:4;position:fixed;inset:0;max-width:520px;margin:auto;overflow:hidden;background:var(--sky)}
.s-title{--sky:linear-gradient(#2b1650,#a8456f 72%,#f2a65a)}
.s-intro{--sky:linear-gradient(#2a1a5e,#7a3f8f 70%,#e58a7a)}
.s-cake{--sky:linear-gradient(#241353,#4b2a78 75%,#8a4a8c);--g:236px}
.s-poem{--sky:linear-gradient(#070a2a,#14205a 80%,#27386e)}
.s-play{--sky:linear-gradient(#0c1040,#232a6e 80%,#3a3f86)}
.s-final{--sky:linear-gradient(#03041a,#0a0f3a 85%,#141a52)}
#stars i{position:absolute;background:#fff;width:2px;height:2px;animation:tw 2.4s steps(2) infinite}
#stars i.b{width:4px;height:4px;background:#ffe9a8}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#moon{display:none;position:absolute;right:12%;top:9%;width:38px;height:38px;background:#fff3b0;box-shadow:inset -9px -7px 0 #e3d48c;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.s-poem #moon,.s-play #moon,.s-final #moon{display:block}
.cloud{position:absolute;width:56px;height:12px;background:#fff;opacity:.18;box-shadow:12px -10px 0 -2px #fff,32px -10px 0 -2px #fff;animation:drift var(--d,70s) linear infinite;left:-120px}
@keyframes drift{to{transform:translateX(120vw)}}
#ground{position:absolute;left:0;right:0;bottom:0;height:var(--g);background:linear-gradient(#58b06a 0 8px,#3f8a4e 8px 14px,#2b2150 14px);display:none}
.s-intro #ground,.s-cake #ground,.s-poem #ground,.s-play #ground,.s-final #ground{display:block}
.s-poem #ground,.s-play #ground,.s-final #ground{filter:brightness(.5) saturate(.8)}
#dimv{position:absolute;inset:0;background:#05052a;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
.dim #dimv{opacity:.4}
.scene{position:absolute;inset:0;display:none;pointer-events:none;z-index:1}
.scene.on{display:block}#sc-cake{z-index:3}.scene .pe{pointer-events:auto}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s steps(6);z-index:20}
#fade.on{opacity:1;pointer-events:auto}
.shake{animation:shk .35s steps(6)}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
/* buttons */
.btn{font:inherit;font-size:12px;color:#fff;background:#ff7aa8;border:0;padding:15px 18px;min-height:52px;cursor:pointer;text-shadow:2px 2px 0 #8a2a50;margin:4px;
box-shadow:inset -4px -4px 0 #c2436f,inset 4px 4px 0 #ffb3cf,0 0 0 4px #2a0f3a,6px 6px 0 4px rgba(0,0,0,.35);transition:transform .06s steps(2),box-shadow .06s steps(2)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(4px,4px);box-shadow:inset -4px -4px 0 #c2436f,inset 4px 4px 0 #ffb3cf,0 0 0 4px #2a0f3a,2px 2px 0 4px rgba(0,0,0,.35)}
.btn.big{font-size:20px;padding:20px 34px;animation:pulse 1.4s steps(2) infinite}
.btn.blue{background:#6aa8ff;text-shadow:2px 2px 0 #2a4f9a;box-shadow:inset -4px -4px 0 #3f6fc4,inset 4px 4px 0 #b3d1ff,0 0 0 4px #0f1a3a,6px 6px 0 4px rgba(0,0,0,.35)}
.btn.small{font-size:9px;padding:12px 10px;min-height:48px}
@keyframes pulse{50%{transform:scale(1.04)}}
.bot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;justify-content:center;flex-wrap:wrap;gap:8px;z-index:4}
#snd{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;z-index:30;width:44px;height:44px;padding:0;font-size:16px;min-height:44px;margin:0}
/* title */
#sc-title{text-align:center;padding-top:calc(env(safe-area-inset-top) + 16vh)}
#ttl{font-size:clamp(26px,9.5vw,46px);line-height:1.3;margin:0;text-shadow:4px 4px 0 #5a1f4a,-2px -2px 0 #ffb3cf;letter-spacing:2px;transition:transform .8s steps(8),opacity .8s steps(8)}
#mt{display:inline-block;color:#ffd86b;cursor:pointer;pointer-events:auto}#mt.hop{animation:hop .3s steps(3)}
@keyframes hop{50%{transform:translateY(-12px)}}
#sub{font-size:11px;margin:22px 0 46px;color:#ffe9f2;line-height:1.7;transition:opacity .6s steps(6)}
#hint{font-size:8px;margin-top:22px;color:#ffd1e3;opacity:.8;transition:opacity .6s}
.out #ttl{transform:translateY(-60px);opacity:0}.out #sub,.out #hint,.out #play{opacity:0}
/* madi */
#madi{position:absolute;bottom:calc(var(--g) - 10px);left:50%;z-index:2;transform:translateX(-50%);transition:left .7s steps(10),opacity .4s;cursor:pointer}
#madi.hide{opacity:0;pointer-events:none}
#mb{animation:bob 1.2s steps(2) infinite}
#mb.tilt{transform:rotate(-7deg)}#mb.bounce{animation:jump .35s steps(4) 3}#mb.drop{animation:drop .7s steps(7)}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes jump{50%{transform:translateY(-22px)}}
@keyframes drop{from{transform:translateY(-260px)}}
#mi{width:calc(24px*var(--s));height:calc(30px*var(--s));display:block}
/* dialog */
#dlg{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:8;display:none;gap:12px;align-items:flex-start;min-height:100px;padding:14px;background:#1a1040;border:4px solid #fff;box-shadow:0 0 0 4px #1a1040,6px 6px 0 4px rgba(0,0,0,.4);cursor:pointer}
#dlg.on{display:flex}
#pt{width:54px;height:54px;flex:none;background:#3a2670;border:3px solid #ff9ec0;display:block}
#nm{font-size:9px;color:#ff9ec0;margin-bottom:8px;min-height:10px}
#tx{font-size:11px;line-height:1.7}
#nx{position:absolute;right:12px;bottom:8px;font-size:10px;color:#ffd86b;animation:bl .6s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#bub{position:absolute;left:50%;top:21%;transform:translateX(-50%);z-index:7;max-width:84%;background:#fff;color:#2a1440;font-size:10px;line-height:1.6;padding:12px;text-align:center;display:none;box-shadow:0 0 0 4px #2a1440,5px 5px 0 4px rgba(0,0,0,.3);pointer-events:none}
#bub img{width:40px;height:40px;flex:none;background:#3a2670;border:2px solid #ff9ec0}
#bub.on{display:flex;align-items:center;gap:10px;animation:pop .2s steps(3)}
@keyframes pop{from{transform:translateX(-50%) scale(.7)}}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none}
/* cake scene */
#q{position:absolute;top:calc(env(safe-area-inset-top) + 5%);left:12px;right:12px;display:flex;align-items:center;gap:12px;font-size:12px;line-height:1.6;padding:10px;background:#1a1040;border:4px solid #fff;box-shadow:0 0 0 4px #1a1040,5px 5px 0 4px rgba(0,0,0,.4)}
#qp{width:56px;height:56px;flex:none;background:#3a2670;border:3px solid #ff9ec0}
#cake{position:absolute;bottom:calc(var(--g) - 4px);right:5%;width:150px}
#cds{display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-end;margin:0 auto 4px;min-height:20px;cursor:pointer}
.cd{width:5px;height:12px;margin:1px;background:repeating-linear-gradient(#ff7aa8 0 3px,#fff 3px 6px);position:relative;animation:cin .2s steps(3)}
.cd.lv{animation:cout .15s steps(3) forwards}
@keyframes cin{from{transform:scale(0) translateY(-8px)}}@keyframes cout{to{transform:scale(0)}}
.cd u{display:none;position:absolute;left:0;top:-7px;width:5px;height:6px;background:#ffd23f;box-shadow:inset 0 -2px 0 #ff8a2a;animation:fl .28s steps(2) infinite}
.cd.lit u{display:block}@keyframes fl{50%{transform:scaleY(1.3) translateX(1px)}}
.t1{width:100px;height:30px;margin:0 auto;background:#ffd6e7;box-shadow:inset 0 6px 0 #fff,inset 0 -4px 0 #f0a3c2,0 0 0 4px #5a2a4a}
.t2{width:140px;height:40px;margin:0 auto;background:#b86b3d;box-shadow:inset 0 8px 0 #ffd6e7,inset 0 -5px 0 #8f4a26,0 0 0 4px #5a2a4a}
.plate{width:150px;height:8px;background:#e8e8f5;box-shadow:0 0 0 4px #5a2a4a}
#ctl{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:12px 6px;background:rgba(20,10,50,.85);border:4px solid #ff9ec0;text-align:center}
#row{display:flex;align-items:center;justify-content:center;gap:6px}
#age{font-size:30px;min-width:76px;color:#ffd86b;text-shadow:3px 3px 0 #5a2a4a}
#age.bump{animation:bump .18s steps(3)}@keyframes bump{50%{transform:scale(1.35)}}
.s-wish #ctl,.s-wish #q{display:none}
/* poem — paper scroll */
#scroll{position:absolute;top:calc(env(safe-area-inset-top) + 5%);left:50%;transform:translateX(-50%);width:max-content;max-width:98%}
.rod{height:12px;margin:0 -2px;background:linear-gradient(#d9a45c 0 4px,#a8703a 4px 8px,#6e4521 8px);box-shadow:0 0 0 3px #3a2410,4px 4px 0 3px rgba(0,0,0,.3);position:relative}
.rod::before,.rod::after{content:'';position:absolute;top:-3px;bottom:-3px;width:8px;background:#e8c27a;box-shadow:0 0 0 3px #3a2410}.rod::before{left:-8px}.rod::after{right:-8px}
#paper{height:0;overflow:hidden;background:#f3e3b8;margin:0 6px;box-shadow:inset 6px 0 0 #e6d29b,inset -6px 0 0 #e6d29b,inset 0 -4px 0 #e0c98e;transition:height 2.2s steps(18)}
#poem{position:relative;padding:14px 20px;font-size:clamp(7px,2.2vw,9px);line-height:20px;color:#4a3320}
#poem::before{content:'';position:absolute;left:12px;top:8px;bottom:8px;width:24px;background:rgba(190,60,40,.14);opacity:0;transition:opacity 2s}
#poem.rev::before{opacity:1}
.ln{display:flex;gap:5px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity 1.2s,transform 1.2s}.ln.show{opacity:1;transform:none}.gap{height:14px}
.ln b{width:14px;flex:none;text-align:center;font-size:1.2em;color:#8a3a12;transition:all 1.4s}
.ln span{transition:opacity 2s}
#poem.dim .ln span{opacity:.35}#poem.dim .ln b{color:#a82a10}
#poem.rev .ln b{color:#c0281c;transform:scale(1.35)}
#note{margin-top:14px;font-size:10px;color:#fff;opacity:0;transition:opacity 1.5s;text-align:center;text-shadow:2px 2px 0 #000}
#note2{margin-top:10px;font-size:11px;color:#ffd86b;letter-spacing:2px;opacity:0;transition:opacity 2s;text-align:center;text-shadow:2px 2px 0 #000,0 0 8px #ffb347}
#note.on,#note2.on{opacity:1}
#secret{position:absolute;top:calc(env(safe-area-inset-top) + 3%);left:14%;width:5px;height:5px;background:#ffe9a8;animation:tw 1.6s steps(2) infinite}
#secret::after{content:'';position:absolute;inset:-14px}
.ff{position:absolute;width:3px;height:3px;background:#d8ff7a;box-shadow:0 0 6px #d8ff7a;animation:ffa 6s ease-in-out infinite}
@keyframes ffa{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-16px);opacity:1}}
/* explore */
#hintp{position:absolute;top:calc(env(safe-area-inset-top) + 5%);left:0;right:0;text-align:center;font-size:9px;color:#cfd2ff;line-height:1.7}
.obj{position:absolute;bottom:calc(var(--g) - 6px);transform:translateX(-50%);cursor:pointer}
.obj.near{animation:jump .6s steps(3) infinite}
.obj.near::after{content:'!';position:absolute;top:-22px;left:50%;color:#ffd86b;font-size:12px;transform:translateX(-50%)}
.obj.seen{filter:brightness(.8)}
.talk #pad{display:none}
#pad{justify-content:space-between;padding:0 14px}
#pad .btn{min-width:84px;font-size:18px}
#oneMoreB{top:calc(env(safe-area-inset-top) + 12%);bottom:auto}
/* final */
.hs{position:absolute;width:6px;height:6px;background:#ffe9a8;box-shadow:0 0 8px #ffe9a8;transition:left 4.5s cubic-bezier(.4,0,.2,1),top 4.5s cubic-bezier(.4,0,.2,1);z-index:2}
#hs.pulse{animation:hb .5s steps(4)}@keyframes hb{50%{transform:scale(1.15)}}
#hs.beat{animation:hb 2.4s steps(6) infinite}
#hh{position:absolute;z-index:3;cursor:pointer}
#fm{position:absolute;left:0;right:0;text-align:center;z-index:2}
#f1,#f2{opacity:0;transition:opacity 2s;text-shadow:0 0 10px #ff8fb5}#f1{font-size:12px;line-height:1.7;color:#ffd1e3}#f2{font-size:11px;margin-top:14px;color:#ffe9a8}
#f1.on,#f2.on{opacity:1}
@media (max-height:520px){.s-cake{--g:150px}#q{font-size:10px;top:4%}#age{font-size:20px}.btn{padding:8px 10px;min-height:38px}}

/* ---- new chapter ---- */
.s-ride{--sky:linear-gradient(#3b1f5e,#c2456f 50%,#ffb25a 80%)}
.s-poem{--sky:linear-gradient(#3b1f5e,#c2456f 52%,#ff9a4a 80%,#ffd27a)}
.s-poem #moon{display:none}.s-poem #stars{opacity:.25}.s-poem #ground{filter:sepia(.35) saturate(1.3) brightness(.8)}
#sun{display:none;position:absolute;left:50%;bottom:var(--g);width:96px;height:48px;margin-left:-48px;background:#ffe08a;border-radius:96px 96px 0 0;box-shadow:0 0 40px 10px #ffb25a}.s-poem #sun{display:block}
#scroll{width:96%;max-width:500px}#poem{font-size:clamp(7px,2.1vw,9px);line-height:1.7}.ln{white-space:normal}.ln span{flex:1}
.gimg{position:absolute;bottom:calc(var(--g) - 10px);transform:translateX(-50%);z-index:2;transition:left 1s steps(10),bottom .6s steps(6)}
#marcus{width:calc(24px*var(--s))}#gift{width:calc(14px*var(--s))}#ltr{width:calc(10px*var(--s))}#thf{width:calc(29px*var(--s))}
#rc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#wrap{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
background:radial-gradient(circle at 25% 25%,#fff 0 3px,transparent 4px) 0 0/40px 40px,radial-gradient(circle at 75% 75%,#ffd86b 0 3px,transparent 4px) 0 0/40px 40px,repeating-linear-gradient(45deg,#ff7aa8 0 20px,#ff5c8a 20px 40px)}
#wrap.on{display:flex}
#wrap::before,#wrap::after{content:'';position:absolute;background:#ffd86b;box-shadow:inset 6px 6px 0 #ffe9a8,inset -6px -6px 0 #d9a93a}
#wrap::before{left:50%;top:0;bottom:0;width:40px;margin-left:-20px}#wrap::after{top:50%;left:0;right:0;height:40px;margin-top:-20px}
#tag{position:relative;z-index:2;width:min(78%,300px);padding:34px 14px 20px;background:#fff3d0;color:#4a2a2a;text-align:center;box-shadow:0 0 0 4px #5a2a4a,8px 8px 0 4px rgba(0,0,0,.3);transform-origin:50% -40px;animation:sway 3s steps(6) infinite alternate;cursor:pointer}
#tag::before{content:'';position:absolute;top:-44px;left:50%;width:4px;height:48px;background:#c2436f}
#tag i{position:absolute;top:10px;left:50%;width:14px;height:14px;margin-left:-7px;background:#ff5c8a;box-shadow:0 0 0 3px #5a2a4a}
#tag b{display:block;font-size:20px;line-height:1.4}#tag u{display:block;text-decoration:none;font-size:12px;margin:14px 0;color:#c2436f}#tag span{display:block;font-size:10px;line-height:1.8;color:#a82a10}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#tag.sw{animation:wob .4s steps(4)}@keyframes wob{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes toss{50%{transform:translateX(-50%) translateY(-34px)}}.toss{animation:toss 1s steps(12)}
@keyframes wob2{25%{transform:translateX(-50%) rotate(-10deg)}75%{transform:translateX(-50%) rotate(10deg)}}.wobg{animation:wob2 .25s steps(4) 4}
@keyframes spinup{0%{transform:translateX(-50%) translateY(0) rotate(0)}50%{transform:translateX(-50%) translateY(-90px) rotate(360deg)}100%{transform:translateX(-50%) translateY(0) rotate(720deg)}}.fly{animation:spinup 1s steps(14)}
@keyframes lf{50%{transform:translateX(-50%) translateY(-6px)}}.lf{animation:lf .8s steps(2) infinite}
.rod{display:none}
#paper{margin:0;background:linear-gradient(#f9eed0,#f1deb0);box-shadow:0 0 0 3px #5a3a1e,0 0 0 6px #e7d19a,8px 10px 0 5px rgba(0,0,0,.28)}
#poem{font-family:'Caveat','Segoe Script','Comic Sans MS',cursive;font-size:clamp(15px,4vw,18px);line-height:1.15;font-weight:600;color:#3a2614;padding:16px 18px 16px 44px}
#poem::before{left:10px;top:0;bottom:0;width:2px;background:rgba(190,60,40,.45);opacity:1}
.ln{align-items:baseline;gap:4px;margin:1px 0}.ln b{width:1.2em;font-size:1.4em;line-height:.9}.gap{height:10px}
#note2{font-size:10px;line-height:1.9}
#env{position:absolute;left:50%;top:30%;width:min(80%,300px);aspect-ratio:3/2;transform:translateX(-50%);z-index:6;cursor:pointer;transition:transform .7s steps(7),opacity .7s steps(7)}
#env.in{animation:envin .8s steps(8),envbob 2s steps(2) .8s infinite}
@keyframes envin{from{transform:translateX(-50%) translateY(-260px)}}@keyframes envbob{50%{transform:translateX(-50%) translateY(-6px)}}
#env.out{animation:none;transform:translateX(-50%) scale(1.5);opacity:0}
#env div{position:absolute}
.eb{inset:0;background:#d9b87a;box-shadow:0 0 0 4px #5a3a1e,8px 8px 0 4px rgba(0,0,0,.3);z-index:1}
.el{left:8%;right:8%;top:6%;height:84%;background:#fbf0d0;box-shadow:0 0 0 3px #5a3a1e;z-index:2;transition:transform 1.3s steps(10)}
.ef{inset:0;background:#e8c88a;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3}
.efl{left:0;right:0;top:0;height:56%;background:#c9a460;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s steps(8);z-index:4}
.seal{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;background:#c0281c;box-shadow:inset -4px -4px 0 #8a1810,inset 4px 4px 0 #e0584a;z-index:5;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);font-size:14px;color:#ffd0c8;text-align:center;line-height:34px;animation:pulse 1.2s steps(2) infinite}
#env.open .seal{display:none}#env.open .efl{transform:rotateX(180deg);z-index:0}#env.rise .el{transform:translateY(-70%)}
#envh{position:absolute;left:0;right:0;bottom:26%;text-align:center;font-size:10px;color:#fff;text-shadow:2px 2px 0 #000;animation:bl .7s steps(2) infinite;z-index:6}
#thf{width:calc(32px*var(--s));margin-bottom:calc(-2px*var(--s))}
#ccard{position:absolute;inset:0;z-index:35;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
#ccard small{font-size:9px;color:#cdbb8e;letter-spacing:2px}#ccard b{font:italic 28px Georgia,serif;color:#f0e2bc;margin-top:12px}#ccard i{display:block;width:60%;height:1px;background:#f0e2bc;margin-top:14px}
@keyframes ccf{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
</style></head><body>
<div id="game" class="s-title">
 <div id="stars"></div><div id="moon"></div>
 <div class="cloud" style="top:12%;--d:80s"></div><div class="cloud" style="top:26%;--d:110s;animation-delay:-40s"></div><div class="cloud" style="top:40%;--d:95s;animation-delay:-70s"></div>
 <div id="ground"></div><div id="dimv"></div>

 <section id="sc-title" class="scene on">
  <h1 id="ttl">FOR<br><span id="mt" class="pe">MADI</span></h1>
  <div id="sub">A tiny birthday<br>adventure</div>
  <button id="play" class="btn big pe">PLAY</button>
  <div id="hint">best experienced with sound :)</div>
 </section>

 <section id="sc-cake" class="scene">
  <div id="q"><img id="qp" alt=""><span id="qt"></span></div>
  <div id="cake" class="pe"><div id="cds"></div><div class="t1"></div><div class="t2"></div><div class="plate"></div></div>
  <div id="ctl" class="pe">
   <div id="row"><button class="btn small blue" id="dn">◀ YOUNGER</button><div id="age">15</div><button class="btn small blue" id="up">OLDER ▶</button></div>
   <button class="btn" id="submit" style="margin-top:12px;width:70%">SUBMIT</button>
  </div>
  <div class="bot"><button class="btn pe" id="blowB" hidden>BLOW OUT THE CANDLES</button><button class="btn pe" id="contB" hidden>CONTINUE</button></div>
